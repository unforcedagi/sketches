<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friend / Enemy Dots</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #ddd;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 16px; box-sizing: border-box; height: 100%; }
  canvas { background: #12121a; border-radius: 8px; max-width: 100%;
    max-height: calc(100% - 90px); }
  #controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    font-size: 13px; }
  label { display: flex; gap: 6px; align-items: center; }
  input[type=range] { width: 110px; }
  button { background: #222233; color: #ddd; border: 1px solid #444;
    border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
  #credit { font-size: 11px; color: #777; }
  a { color: #8ab4f8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="700" height="700"></canvas>
  <div id="controls">
    <label>dots <input id="n" type="range" min="20" max="600" value="250"><span id="nv">250</span></label>
    <label>friend step <input id="fp" type="range" min="0" max="50" value="22"><span id="fpv">2.2</span></label>
    <label>enemy step <input id="ep" type="range" min="0" max="50" value="12"><span id="epv">1.2</span></label>
    <button id="reset">reset</button>
  </div>
  <div id="credit">rules: each dot picks one friend + one enemy · each tick: 0.5% toward centre,
    a fixed large step toward friend, a fixed small step away from enemy · dots occasionally re-choose ·
    after <a href="https://x.com/IsaacKing314/status/2086721066106253347">@IsaacKing314</a> ·
    <a href="https://unforcedagi.github.io/sketches/">← more sketches</a></div>
</div>
<script src="../lib/gifenc.js"></script>
<script src="../lib/controls.js"></script>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2;

let N = 250;
// Fixed-size steps, like the original: direction matters, distance doesn't.
// (Proportional steps make the dynamics linear, and the swarm collapses onto
// one axis — the diagonal-line failure. Fixed steps also read far smoother:
// every dot moves at constant speed instead of teleporting when far away.)
let FRIEND_STEP = 2.2;   // px per tick toward friend
let ENEMY_STEP = 1.2;    // px per tick away from enemy
const CENTER_PULL = 0.005; // 0.5% toward centre per tick
const RECHOOSE_P = 0.004;  // per-dot per-tick chance of re-choosing
const JITTER = 0.3;        // px of noise per tick, keeps things mixed
const M = 6;               // canvas margin

let dots = [];

function pickOther(i, count) {
  let j;
  do { j = Math.floor(Math.random() * count); } while (j === i);
  return j;
}

function init() {
  dots = [];
  for (let i = 0; i < N; i++) {
    const x = Math.random() * W, y = Math.random() * H;
    dots.push({
      x, y, px: x, py: y,
      hue: Math.floor(Math.random() * 360),
      friend: 0, enemy: 0,
    });
  }
  for (let i = 0; i < N; i++) {
    dots[i].friend = pickOther(i, N);
    dots[i].enemy = pickOther(i, N);
  }
}

function step() {
  const next = [];
  for (let i = 0; i < N; i++) {
    const d = dots[i], f = dots[d.friend], e = dots[d.enemy];
    let x = d.x, y = d.y;

    x += (CX - x) * CENTER_PULL;
    y += (CY - y) * CENTER_PULL;

    const fdx = f.x - x, fdy = f.y - y;
    const fd = Math.hypot(fdx, fdy);
    if (fd > 0.001) {
      const s = Math.min(FRIEND_STEP, fd); // don't overshoot when close
      x += fdx / fd * s;
      y += fdy / fd * s;
    }

    const edx = e.x - x, edy = e.y - y;
    const ed = Math.hypot(edx, edy);
    if (ed > 0.001) {
      x -= edx / ed * ENEMY_STEP;
      y -= edy / ed * ENEMY_STEP;
    }

    x += (Math.random() - 0.5) * 2 * JITTER;
    y += (Math.random() - 0.5) * 2 * JITTER;

    next.push({ x, y });
  }
  for (let i = 0; i < N; i++) {
    const d = dots[i];
    d.px = d.x; d.py = d.y;
    d.x = Math.min(W - M, Math.max(M, next[i].x));
    d.y = Math.min(H - M, Math.max(M, next[i].y));
    if (Math.random() < RECHOOSE_P) {
      d.friend = pickOther(i, N);
      d.enemy = pickOther(i, N);
    }
  }
}

function draw(alpha) {
  ctx.fillStyle = '#12121a';
  ctx.fillRect(0, 0, W, H);
  for (const d of dots) {
    // interpolate between the last two ticks for 60fps-smooth motion
    const x = d.px + (d.x - d.px) * alpha;
    const y = d.py + (d.y - d.py) * alpha;
    ctx.fillStyle = `hsl(${d.hue} 75% 68%)`;
    ctx.beginPath();
    ctx.arc(x, y, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

const $ = id => document.getElementById(id);
$('n').oninput = e => { N = +e.target.value; $('nv').textContent = N; init(); };
$('fp').oninput = e => { FRIEND_STEP = e.target.value / 10; $('fpv').textContent = FRIEND_STEP.toFixed(1); };
$('ep').oninput = e => { ENEMY_STEP = e.target.value / 10; $('epv').textContent = ENEMY_STEP.toFixed(1); };
$('reset').onclick = init;

init();
SketchControls.attach({ canvas: cv, step, draw, ticksPerSecond: 30 });
</script>
</body>
</html>
